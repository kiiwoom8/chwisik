name: Android app

# Builds the Android app (Capacitor shell in app/) and puts the APK on the release "android-latest".
# The app updates its page by itself from the server, so a new APK is only needed when app/ changes.
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/android.yml"
      # the icon script and its source picture don't change the APK; the PNGs it writes do
      - "!app/make-icons.py"
      - "!app/icon-source.*"
      - "!app/icon-preview.png"
  workflow_dispatch:

concurrency:
  group: android-app
  cancel-in-progress: true

permissions:
  contents: write   # releases + the app key line in AppKeys.gs
  actions: write    # starts the Apps Script deploy after that

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Capacitor and copy the page in
        working-directory: app
        run: |
          npm ci --no-audit --no-fund
          node build.mjs

      # Every build gets its own random app key: only inside this APK (never in git); its SHA-256 goes into
      # apps-script/AppKeys.gs, so the app gets in without the 접근 코드 (Code.gs redeemApp).
      - name: App key for this build
        run: |
          KEY=$(openssl rand -base64 33 | tr '+/' '-_' | tr -d '=\n')
          echo "::add-mask::$KEY"
          grep -q '%%CHWISIK_APP_KEY%%' app/www/index.html
          sed -i "s|%%CHWISIK_APP_KEY%%|$KEY|" app/www/index.html
          ! grep -q '%%CHWISIK_APP_KEY%%' app/www/index.html
          echo "APP_KEY_HASH=$(printf '%s' "$KEY" | sha256sum | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Create the Android project
        working-directory: app
        run: |
          npx cap add android
          # our icons and launch screen (plain PNGs + splash.xml; drop Capacitor's logo files)
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          rm -f android/app/src/main/res/drawable*/splash.png
          cp -r android-res/* android/app/src/main/res/
          # version: build number, so a newer APK installs over an older one
          sed -i "s/versionCode 1$/versionCode ${GITHUB_RUN_NUMBER}/; s/versionName \"1.0\"/versionName \"1.${GITHUB_RUN_NUMBER}\"/" android/app/build.gradle
          # target Android 14: Android 15 forces edge-to-edge for apps targeting 35, which would put the page under the status bar
          sed -i "s/targetSdkVersion = [0-9]*/targetSdkVersion = 34/" android/variables.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle
          grep -n "targetSdkVersion" android/variables.gradle
          npx cap sync android

      - name: Build APK
        working-directory: app/android
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PW: ${{ secrets.ANDROID_KEYSTORE_PW }}
        run: |
          chmod +x gradlew
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          if [ -n "$KS_B64" ] && [ -n "$KS_PW" ]; then
            ./gradlew --no-daemon assembleRelease
            printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
            "$BT/zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
            "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.p12" --ks-type PKCS12 --ks-pass env:KS_PW --ks-key-alias chwisik \
              --out "$GITHUB_WORKSPACE/chwisik.apk" "$RUNNER_TEMP/aligned.apk"
            rm -f "$RUNNER_TEMP/release.p12"
            echo "SIGNED=release" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing key secrets (ANDROID_KEYSTORE_B64 / ANDROID_KEYSTORE_PW): built a debug APK. Phones that install it must uninstall it before a release-signed APK can be installed."
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/chwisik.apk"
            echo "SIGNED=debug" >> "$GITHUB_ENV"
          fi
          "$BT/apksigner" verify --print-certs "$GITHUB_WORKSPACE/chwisik.apk" | head -3

      - name: Register the app key on the server (AppKeys.gs, then deploy)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -- app/www/index.html   # the key never goes into git
          ok=0
          for i in 1 2 3; do
            git fetch -q origin main && git reset -q --hard origin/main
            sed -i "/^\];/i \  '${APP_KEY_HASH}', // android-1.${GITHUB_RUN_NUMBER}" apps-script/AppKeys.gs
            grep -q "${APP_KEY_HASH}" apps-script/AppKeys.gs
            git add apps-script/AppKeys.gs
            git commit -q -m "Android app key for android-1.${GITHUB_RUN_NUMBER}"
            if git push -q origin HEAD:main; then ok=1; break; fi
            sleep 5
          done
          test "$ok" = 1
          # a push by this token starts no workflows, so start the deploy by hand
          gh workflow run deploy.yml --ref main

      - uses: actions/upload-artifact@v4
        with:
          name: chwisik-apk
          path: chwisik.apk

      # Every build goes to GitHub Releases: its own release android-1.<run> (kept as history)
      # and android-latest (always the newest, a fixed place to download from).
      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="커밋 ${GITHUB_SHA::7} ($(git log -1 --pretty=%s | cut -c1-80)). chwisik.apk 를 받아서 폰에 설치하세요. 앱 화면은 서버에서 알아서 최신으로 바뀌어요."
          gh release create "android-1.${GITHUB_RUN_NUMBER}" chwisik.apk \
            --title "취식 안드로이드 1.${GITHUB_RUN_NUMBER} (${SIGNED})" --notes "$NOTES" --target "$GITHUB_SHA"
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest chwisik.apk --latest \
            --title "취식 안드로이드 앱 — 최신 (1.${GITHUB_RUN_NUMBER}, ${SIGNED})" --notes "$NOTES" --target "$GITHUB_SHA"
