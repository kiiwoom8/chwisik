name: Android app

# Builds the Android app (Capacitor shell in app/) and puts the APK on the release "android-latest".
# The app updates its page by itself from the server, so a new APK is only needed when app/ changes; installed
# APKs then update themselves from android-latest/version.json (app/android-java/Updater.java).
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/android.yml"
      # the icon script and its source picture don't change the APK; the PNGs it writes do
      - "!app/make-icons.py"
      - "!app/icon-source.*"
      - "!app/icon-preview.png"
  workflow_dispatch:

concurrency:
  group: android-app
  cancel-in-progress: true

permissions:
  contents: write   # releases

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Capacitor and copy the page in
        working-directory: app
        run: |
          npm ci --no-audit --no-fund
          node build.mjs

      - name: Create the Android project
        working-directory: app
        run: |
          npx cap add android
          # our icons and launch screen (plain PNGs + splash.xml; drop Capacitor's logo files)
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          rm -f android/app/src/main/res/drawable*/splash.png
          cp -r android-res/* android/app/src/main/res/
          # self-update (app/android-java/Updater.java, docs/DEVNOTES.md → App → Updates): our MainActivity replaces the
          # generated one; the manifest gets the install permissions and the installer's result receiver
          J=android/app/src/main/java/com/kiiwoom8/chwisik
          test -f "$J/MainActivity.java"
          cp android-java/*.java "$J/"
          python3 - <<'EOF'
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p, encoding="utf-8").read()
          assert s.count("</application>") == 1 and s.count("</manifest>") == 1
          s = s.replace("</application>", '    <receiver android:name=".Updater$Done" android:exported="false" />\n    </application>')
          s = s.replace("</manifest>", '    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\n'
                        '    <uses-permission android:name="android.permission.UPDATE_PACKAGES_WITHOUT_USER_ACTION" />\n</manifest>')
          open(p, "w", encoding="utf-8").write(s)
          EOF
          grep -n "Updater\|INSTALL_PACKAGES" android/app/src/main/AndroidManifest.xml
          # version: build number, so a newer APK installs over an older one
          sed -i "s/versionCode 1$/versionCode ${GITHUB_RUN_NUMBER}/; s/versionName \"1.0\"/versionName \"1.${GITHUB_RUN_NUMBER}\"/" android/app/build.gradle
          # target Android 14: Android 15 forces edge-to-edge for apps targeting 35, which would put the page under the status bar
          sed -i "s/targetSdkVersion = [0-9]*/targetSdkVersion = 34/" android/variables.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle
          grep -n "targetSdkVersion" android/variables.gradle
          npx cap sync android

      - name: Build APK
        working-directory: app/android
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PW: ${{ secrets.ANDROID_KEYSTORE_PW }}
        run: |
          chmod +x gradlew
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          if [ -n "$KS_B64" ] && [ -n "$KS_PW" ]; then
            ./gradlew --no-daemon assembleRelease
            printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
            "$BT/zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
            "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.p12" --ks-type PKCS12 --ks-pass env:KS_PW --ks-key-alias chwisik \
              --out "$GITHUB_WORKSPACE/chwisik.apk" "$RUNNER_TEMP/aligned.apk"
            rm -f "$RUNNER_TEMP/release.p12"
            echo "SIGNED=release" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing key secrets (ANDROID_KEYSTORE_B64 / ANDROID_KEYSTORE_PW): built a debug APK. Phones that install it must uninstall it before a release-signed APK can be installed."
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/chwisik.apk"
            echo "SIGNED=debug" >> "$GITHUB_ENV"
          fi
          "$BT/apksigner" verify --print-certs "$GITHUB_WORKSPACE/chwisik.apk" | head -3

      - uses: actions/upload-artifact@v4
        with:
          name: chwisik-apk
          path: chwisik.apk

      # Every build goes to GitHub Releases: its own release android-1.<run> (kept as history)
      # and android-latest (always the newest, a fixed place to download from).
      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="커밋 ${GITHUB_SHA::7} ($(git log -1 --pretty=%s | cut -c1-80)). chwisik.apk 를 받아서 폰에 설치하세요. 앱 화면은 서버에서 알아서 최신으로 바뀌어요."
          gh release create "android-1.${GITHUB_RUN_NUMBER}" chwisik.apk \
            --title "취식 안드로이드 1.${GITHUB_RUN_NUMBER} (${SIGNED})" --notes "$NOTES" --target "$GITHUB_SHA"
          # version.json tells installed apps there is a newer build (Updater.java); only release-signed builds,
          # since a debug APK cannot install over a release-signed one
          FILES="chwisik.apk"
          if [ "$SIGNED" = release ]; then printf '{"versionCode":%s}\n' "$GITHUB_RUN_NUMBER" > version.json; FILES="chwisik.apk version.json"; fi
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest $FILES --latest \
            --title "취식 안드로이드 앱 — 최신 (1.${GITHUB_RUN_NUMBER}, ${SIGNED})" --notes "$NOTES" --target "$GITHUB_SHA"
