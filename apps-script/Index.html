<!DOCTYPE html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" media="print" onload="this.media='all'">
<style>
/* Layout: receipt-roll column. Sticky header with month + who-am-I, a band per day, each line with two stamp buttons (취식 / 폐기). */
:root {
  --paper: #f2f4f1; --sheet: #ffffff; --ink: #17201b; --muted: #646f69; --rule: #dce2de; --band: #e7ece8;
  --accent: #0e6b52; --accent-ink: #ffffff; --accent-soft: #dfeee8;
  --eat: #b8620e; --eat-soft: #fbead7; --eat-ink: #ffffff;
  --void: #b0442c; --void-soft: #f5e4de; --focus: #2a62d6;
  --sun: #d1242f; --sat: #1f5fd6;
  --ov2: #e6ad12; --ov2-ink: #9a6a00; --ov3: #d1242f;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r: 10px; color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #111614; --sheet: #19201c; --ink: #e6ebe8; --muted: #98a49e; --rule: #2a3330; --band: #1e2622;
    --accent: #4fc49d; --accent-ink: #0a1913; --accent-soft: #1b3a2f;
    --eat: #f0a35a; --eat-soft: #3a2a17; --eat-ink: #1d1206;
    --void: #ec8a71; --void-soft: #3b231d; --focus: #7aa4ff; color-scheme: dark;
    --sun: #ff7b7b; --sat: #7aa8ff;
    --ov2: #f2c14e; --ov2-ink: #f2c14e; --ov3: #ff6b6b;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; overscroll-behavior-y: contain; }
/* pull to refresh */
.ptr { position: fixed; left: 50%; top: env(safe-area-inset-top, 0px); z-index: 20; width: 36px; height: 36px; margin-left: -18px; border-radius: 50%; background: var(--paper); border: 1px solid var(--rule); box-shadow: 0 2px 10px rgba(0,0,0,.3); display: grid; place-items: center; transform: translateY(-44px); opacity: 0; pointer-events: none; }
.ptr i { display: block; width: 16px; height: 16px; border: 2.5px solid var(--muted); border-top-color: transparent; border-radius: 50%; }
.ptr.ready i, .ptr.go i { border-color: var(--accent); border-top-color: transparent; }
.ptr.go i { animation: ptrspin .8s linear infinite; }
@keyframes ptrspin { to { transform: rotate(360deg); } }
body { background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.45; -webkit-tap-highlight-color: transparent; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
[hidden] { display: none !important; }
.wrap { max-width: 680px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

.top { position: sticky; top: 0; z-index: 5; background: var(--sheet); border-bottom: 1px solid var(--rule); padding-top: env(safe-area-inset-top, 0px); }
.top .wrap { padding-block: 12px 10px; display: grid; gap: 10px; }
.titlebar { display: flex; align-items: center; justify-content: space-between; gap: 8px 12px; flex-wrap: wrap; }
h1 { font-size: 19px; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
.month { display: inline-flex; align-items: center; gap: 2px; }
.month button { border: 1px solid var(--rule); background: var(--sheet); border-radius: 8px; width: 34px; height: 32px; cursor: pointer; }
.month button:disabled { opacity: .35; cursor: default; }
.month span { min-width: 6.2em; text-align: center; font-weight: 500; }
.me { display: flex; align-items: center; gap: 8px; font-size: 14px; flex-wrap: wrap; }
.me b { font-size: 16px; }
.linkbtn { border: 0; background: none; color: var(--accent); padding: 4px 2px; cursor: pointer; font-size: 13px; text-decoration: underline; text-underline-offset: 3px; }
.sync { margin-left: auto; font-size: 12px; color: var(--muted); white-space: nowrap; border: 0; background: none; padding: 6px 0 6px 6px; cursor: pointer; }
.sync.ok::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); margin-right: 5px; vertical-align: 1px; }
.sync.bad { color: var(--void); }
.mine { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.mine div { background: var(--band); border-radius: var(--r); padding: 8px 10px; font-size: 12.5px; color: var(--muted); }
.mine b { display: block; color: var(--ink); font-size: 16px; font-weight: 500; }
.mine .eat b { color: var(--eat); }
.tabs { display: grid; grid-template-columns: repeat(8, 1fr); background: var(--band); border-radius: var(--r); padding: 3px; gap: 3px; }
.tab { border: 0; background: transparent; padding: 7px 1px; white-space: nowrap; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 500; color: var(--muted); line-height: 1.2; }
.tab .num { display: block; font-size: 11.5px; }
.tab[aria-selected="true"] { background: var(--sheet); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.search { width: 100%; padding: 9px 12px; border-radius: var(--r); border: 1px solid var(--rule); background: var(--paper); font-size: 15px; }

main .wrap { padding-block: 8px calc(110px + env(safe-area-inset-bottom, 0px)); }
.notice { margin: 12px 0; padding: 12px 14px; border-radius: var(--r); background: var(--void-soft); font-size: 14px; }
.day { margin-top: 14px; }
.day-head { display: flex; justify-content: space-between; align-items: baseline; padding: 6px 2px; font-size: 13px; color: var(--muted); border-bottom: 1px dashed var(--rule); }
.day-head b { color: var(--ink); font-weight: 700; font-size: 14px; }
.rows { display: grid; background: var(--sheet); border-radius: var(--r); overflow: hidden; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; padding: 10px 10px 10px 12px; border-bottom: 1px solid var(--rule); }
.row:last-child { border-bottom: 0; }
.row .info { min-width: 0; }
.row .n { overflow-wrap: anywhere; font-size: 15px; }
.row .meta { font-size: 12px; color: var(--muted); }
.row .tagline { font-size: 12.5px; font-weight: 500; }
.row.t-eat { background: var(--eat-soft); }
.row.t-eat .tagline { color: var(--eat); }
.row.t-void { background: var(--void-soft); }
.row.t-void .tagline { color: var(--void); }
.acts { display: flex; gap: 6px; }
.stamp { border: 1.5px solid var(--rule); background: var(--sheet); border-radius: 9px; min-width: 52px; height: 44px; padding: 0 8px; cursor: pointer; font-weight: 700; font-size: 14px; }
.stamp.eat { color: var(--eat); border-color: color-mix(in srgb, var(--eat) 45%, var(--rule)); }
.stamp.void { color: var(--void); border-color: color-mix(in srgb, var(--void) 45%, var(--rule)); }
.stamp.eat.on { background: var(--eat); color: var(--eat-ink); border-color: var(--eat); }
.stamp.void.on { background: var(--void); color: #fff; border-color: var(--void); }
.stamp.undo { color: var(--muted); }
.stamp:disabled { opacity: .5; }
.neg { color: var(--void); }
.row.t-cancel .tagline { color: var(--muted); font-weight: 400; }
.row.t-cancel .tagline.orphan { color: var(--void); font-weight: 500; }
.cxnote { margin: 12px 2px 0; font-size: 13px; color: var(--muted); }
.jeotag { color: var(--accent); font-weight: 500; }
.empty { text-align: center; color: var(--muted); padding: 40px 12px; }

.sum { margin-top: 14px; display: grid; gap: 14px; }
.sum h2 { font-size: 15px; margin: 0; }
.sumhead { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin: 0 0 6px; }
.sum.less .more { display: none; }
.tbl { overflow-x: auto; background: var(--sheet); border-radius: var(--r); }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th, td { padding: 9px 10px; text-align: right; border-bottom: 1px solid var(--rule); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
thead th { color: var(--muted); font-weight: 500; font-size: 12px; }
tfoot td { font-weight: 700; border-bottom: 0; }
tr.meRow td:first-child { color: var(--accent); font-weight: 700; }

.sheet { position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,.45); display: flex; align-items: flex-end; justify-content: center; }
.sheet .card { background: var(--sheet); width: min(560px, 100%); border-radius: 16px 16px 0 0; padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 12px; max-height: 85vh; overflow-y: auto; }
#confirm { z-index: 35; }
#pwSheet { z-index: 33; }
.sun { color: var(--sun); }
.sat { color: var(--sat); }
.whobar { display: flex; gap: 6px; overflow-x: auto; padding: 12px 0 2px; scrollbar-width: none; }
.whobar::-webkit-scrollbar { display: none; }
.wchip { flex: none; border: 1px solid var(--rule); background: var(--sheet); border-radius: 999px; padding: 6px 12px; font-size: 13.5px; font-weight: 500; cursor: pointer; white-space: nowrap; }
.wchip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.gapnote { margin-top: 12px; padding: 10px 12px; border-radius: var(--r); background: var(--void-soft); font-size: 13.5px; }
.gapwarn { margin: 6px 0; padding: 8px 12px; border-radius: var(--r); background: var(--void-soft); font-size: 13px; display: grid; gap: 2px; }
.gapwarn .gw-t { color: var(--void); font-weight: 500; }
.gapwarn .gw-l { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.card h2 { margin: 0; font-size: 17px; }
.card p { margin: 0; color: var(--muted); font-size: 13.5px; }
.names { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
.names button { border: 1px solid var(--rule); background: var(--paper); border-radius: 10px; padding: 12px 6px; cursor: pointer; font-weight: 500; font-size: 15px; }
.names button.cur { border-color: var(--accent); background: var(--accent-soft); }
.addrow { display: flex; gap: 8px; }
.addrow input { flex: 1; min-width: 0; padding: 10px; border-radius: 10px; border: 1px solid var(--rule); background: var(--paper); font-size: 16px; }
.primary { border: 0; border-radius: 10px; padding: 10px 14px; cursor: pointer; background: var(--accent); color: var(--accent-ink); font-weight: 700; }
.primary.danger { background: var(--void); color: #fff; }
.primary:disabled, .ghost:disabled, .clock:disabled { opacity: .5; cursor: default; }
.ghost { border: 1px solid var(--rule); background: var(--sheet); border-radius: 10px; padding: 10px 14px; cursor: pointer; font-weight: 500; }
.ghost.danger { color: var(--void); border-color: color-mix(in srgb, var(--void) 45%, var(--rule)); }
.btnrow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.btnrow .sp { flex: 1; }
.card .warn { color: var(--ink); font-size: 14.5px; }
.fld { display: grid; gap: 4px; font-size: 13px; color: var(--muted); min-width: 0; }
.fld input { width: 100%; min-width: 0; padding: 10px; border-radius: 10px; border: 1px solid var(--rule); background: var(--paper); font-size: 16px; color: var(--ink); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.card .hint { font-size: 13px; }
.card .hint.bad { color: var(--void); }
.offtag { color: var(--void); }

/* 출근일지 */
.mycard { margin-top: 12px; background: var(--sheet); border-radius: var(--r); padding: 14px; display: grid; gap: 10px; }
.mystate { font-size: 14px; color: var(--muted); }
.mystate b { display: block; color: var(--ink); font-size: 17px; }
.clock { border: 0; border-radius: 12px; height: 52px; font-size: 17px; font-weight: 700; cursor: pointer; background: var(--accent); color: var(--accent-ink); }
.clock.out { background: var(--ink); color: var(--paper); }
.working { font-size: 13px; color: var(--muted); }
.chip { display: inline-block; background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 2px 10px; margin: 4px 4px 0 0; font-weight: 500; }
.srow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; align-items: center; width: 100%; padding: 10px 12px; border: 0; border-bottom: 1px solid var(--rule); background: none; text-align: left; font: inherit; color: inherit; }
.srow:last-child { border-bottom: 0; }
button.srow { cursor: pointer; }
.srow.me { background: var(--accent-soft); }
.srow .who { font-weight: 500; overflow-wrap: anywhere; }
.srow .sub { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.srow .tm { text-align: right; white-space: nowrap; }
.srow .dur { text-align: right; font-size: 12px; color: var(--muted); white-space: nowrap; }
.srow .live { color: var(--accent); font-weight: 700; }
.srow .stale { color: var(--void); }
.srow .edit { color: var(--accent); }
.srow .part { display: block; width: 100%; padding: 0; border: 0; background: none; font: inherit; color: inherit; text-align: right; }
.srow .part + .part { margin-top: 6px; }
.srow button.part { cursor: pointer; }
.srow button.part .tm { color: var(--accent); text-decoration: underline dotted; text-underline-offset: 3px; }
.track { grid-column: 1 / -1; position: relative; height: 4px; background: var(--band); border-radius: 2px; overflow: hidden; margin-top: 4px; }
.track i { position: absolute; top: 0; bottom: 0; background: var(--accent); border-radius: 2px; opacity: .7; }
.track i.ov2 { background: var(--ov2); opacity: 1; border-radius: 0; }
.track i.ov3 { background: var(--ov3); opacity: 1; border-radius: 0; }
.srow .ovnote { font-size: 12px; font-weight: 500; }
.srow .ovnote.ov2 { color: var(--ov2-ink); }
.srow .ovnote.ov3 { color: var(--ov3); }

.snack { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); width: min(560px, calc(100% - 32px)); background: var(--ink); color: var(--paper); border-radius: 12px; padding: 10px 10px 10px 16px; display: flex; align-items: center; gap: 12px; box-shadow: 0 6px 20px rgba(0,0,0,.25); z-index: 40; font-size: 14px; }
.snack span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.snack button { border: 0; background: transparent; color: var(--accent); font-weight: 700; padding: 8px 10px; cursor: pointer; filter: brightness(1.3); }
@media (max-width: 380px) { .stamp { min-width: 46px; font-size: 13px; } .tab { font-size: 11.5px; letter-spacing: -0.03em; } }
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="titlebar">
    <h1>직원 취식 목록</h1>
    <div class="month"><button type="button" id="mPrev" aria-label="이전 달">‹</button><span class="num" id="mLabel">–</span><button type="button" id="mNext" aria-label="다음 달">›</button></div>
  </div>
  <div class="me"><span>나:</span><b id="meName">–</b><button class="linkbtn" id="meChange" type="button">이름 바꾸기</button><button class="linkbtn" id="mePw" type="button" hidden>비밀번호</button><button type="button" class="sync" id="sync" title="눌러서 새로고침">불러오는 중</button></div>
  <div class="mine">
    <div class="eat">이번 달 내 취식<b class="num" id="myEat">–</b></div>
    <div>이번 달 내 폐기<b class="num" id="myVoid">–</b></div>
  </div>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-view="shift" aria-selected="true">출근<span class="num" id="c-shift"></span></button>
    <button class="tab" role="tab" data-view="todo" aria-selected="false">미등록<span class="num" id="c-todo"></span></button>
    <button class="tab" role="tab" data-view="eat" aria-selected="false">취식<span class="num" id="c-eat"></span></button>
    <button class="tab" role="tab" data-view="void" aria-selected="false">폐기<span class="num" id="c-void"></span></button>
    <button class="tab" role="tab" data-view="all" aria-selected="false">전체<span class="num" id="c-all"></span></button>
    <button class="tab" role="tab" data-view="cancel" aria-selected="false">취소<span class="num" id="c-cancel"></span></button>
    <button class="tab" role="tab" data-view="jeo" aria-selected="false">저회전<span class="num" id="c-jeo"></span></button>
    <button class="tab" role="tab" data-view="sum" aria-selected="false">월별<span class="num">합계</span></button>
  </div>
  <input class="search" id="q" type="search" placeholder="상품명 검색" autocomplete="off">
</div></header>

<main><div class="wrap">
  <div class="notice" id="status" hidden></div>
  <div class="whobar" id="whoBar" hidden aria-label="이름으로 보기"></div>
  <div id="list"></div>
  <div id="shifts" hidden></div>
  <div class="sum" id="sum" hidden></div>
  <div class="empty" id="emptyMsg" hidden></div>
</div></main>

<div class="sheet" id="confirm" hidden>
  <div class="card" role="alertdialog" aria-modal="true" aria-labelledby="cfTitle" aria-describedby="cfText">
    <h2 id="cfTitle"></h2>
    <p class="warn" id="cfText"></p>
    <div class="btnrow"><span class="sp"></span><button type="button" class="ghost" id="cfNo">취소</button><button type="button" class="primary" id="cfYes">확인</button></div>
  </div>
</div>

<div class="sheet" id="shiftEd" hidden>
  <form class="card" id="shiftForm" role="dialog" aria-modal="true" aria-labelledby="sfTitle" novalidate>
    <h2 id="sfTitle">근무 기록</h2>
    <p id="sfWho"></p>
    <label class="fld">날짜 (출근한 날)<input type="date" id="sfDate" required></label>
    <div class="two">
      <label class="fld">출근<input type="time" id="sfStart" required></label>
      <label class="fld">퇴근<input type="time" id="sfEnd"></label>
    </div>
    <p class="hint" id="sfHint"></p>
    <label class="fld">메모 (선택)<input type="text" id="sfMemo" maxlength="40" placeholder="예: 대타, 늦게 찍음" autocomplete="off"></label>
    <div class="btnrow"><button type="button" class="ghost danger" id="sfDel">삭제</button><span class="sp"></span><button type="button" class="ghost" id="sfCancel">취소</button><button type="submit" class="primary" id="sfSave">저장</button></div>
  </form>
</div>

<div class="sheet" id="picker" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="pickTitle">
    <h2 id="pickTitle">누구세요?</h2>
    <p>한 번만 고르면 이 폰에 기억돼요. 취식은 전체 이름, 폐기는 이름만 기록됩니다.</p>
    <div class="names" id="names"></div>
    <p>목록에 없으면 한 번만 추가하세요.</p>
    <div class="addrow"><input id="newName" type="text" maxlength="10" placeholder="전체 이름 (예: 김성휘)" autocomplete="off"><button class="primary" id="addBtn" type="button">추가</button></div>
  </div>
</div>

<div class="sheet" id="pwSheet" hidden>
  <form class="card" id="pwForm" role="dialog" aria-modal="true" aria-labelledby="pwTitle" novalidate>
    <h2 id="pwTitle">비밀번호</h2>
    <p id="pwText"></p>
    <label class="fld">비밀번호<input type="password" id="pwInput" maxlength="30" autocomplete="current-password"></label>
    <div class="btnrow"><button type="button" class="ghost danger" id="pwRemove" hidden>없애기</button><span class="sp"></span><button type="button" class="ghost" id="pwCancel">취소</button><button type="submit" class="primary" id="pwOk">확인</button></div>
  </form>
</div>

<div class="snack" id="snack" hidden role="status" aria-live="polite"><span id="snackText"></span><button type="button" id="snackUndo">되돌리기</button></div>

<script>
(function () {
  "use strict";
  var POLL_MS = 5000, LIVE_MS = 3 * 60 * 1000;
  var GRACE_MIN = 30;          // 근무 시작 전/끝난 뒤 이 시간까지는 근무 중으로 봄 (폐기 경고)
  var OPEN_MAX_MIN = 16 * 60;  // 퇴근 안 찍은 근무는 16시간까지만 근무 중
  var OFFSHIFT = "근무외";
  var JEO = "저회전";          // 저회전상품철수 줄 (row[13]): 취식만 가능, 등록 안 해도 됨
  var GAP_MIN = 15;            // 지난 날 근무 기록 사이 이보다 긴 빈 시간은 경고 (가게는 24시간 기준)
  var DOW = ["일", "월", "화", "수", "목", "금", "토"];
  var K_ME = "chwisik.me", K_TOK = "chwisik.tok";
  var S = { months: [], month: "", version: "", rows: [], cancels: [], shifts: [], usual: {}, members: [], me: "", view: "shift", who: "", q: "", busy: 0, sumMore: false, live: null, refreshing: false, online: true };
  var $ = function (id) { return document.getElementById(id); };
  var fmt = function (n) { return Number(n || 0).toLocaleString("ko-KR"); };

  /** One person's row on day d: parts = that person's shifts on day d (one started the day before → only its part on d is drawn).

  /* ---------- 취식 / 폐기 ---------- */

  function edHint() {

  $("shiftForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var d = $("sfDate").value, a = $("sfStart").value, b = $("sfEnd").value;
    if (!d || !a) { snack("날짜와 출근 시간을 적어 주세요."); return; }
    $("sfSave").disabled = true;
    var month = d.slice(0, 7);
    call("saveShift", [ED ? ED[1] : "", d, S.me, a, b, $("sfMemo").value, S.month], function () {
      closeEditor();
      snack(month !== S.month ? month.replace("-", "년 ") + "월 기록으로 저장했어요." : "저장했어요.");
      if (S.months.indexOf(month) < 0) { S.months.push(month); S.months.sort().reverse(); render(); }
    }).catch(function () { $("sfSave").disabled = false; });
  });
  $("sfDel").addEventListener("click", function () {
    var s = ED; if (!s) return;
    confirmBox("이 기록을 지울까요?", dayLabel(s[2]) + " " + s[4] + " – " + (s[5] || "") + "\n지우면 되돌릴 수 없어요.", "지우기", true, function () {
      call("deleteShift", [s[1], S.me, S.month], function () { closeEditor(); snack("지웠어요."); }).catch(function () {});
    });
  });

  /* ---------- confirm ---------- */
  var cfFn = null;
  function confirmBox(title, text, yes, danger, fn) {
    $("cfTitle").textContent = title; $("cfText").textContent = text; $("cfText").style.whiteSpace = "pre-line";
    $("cfYes").textContent = yes; $("cfYes").className = "primary" + (danger ? " danger" : "");
    cfFn = fn; $("confirm").hidden = false;
    setTimeout(function () { $("cfNo").focus(); }, 50);
  }
  function closeConfirm() { $("confirm").hidden = true; cfFn = null; }
  $("cfNo").addEventListener("click", closeConfirm);
  $("cfYes").addEventListener("click", function () { var fn = cfFn; closeConfirm(); if (fn) fn(); });
  $("confirm").addEventListener("click", function (e) { if (e.target === this) closeConfirm(); });

  /* ---------- data ---------- */
  function take(res, force) {
    if (!res || res.month !== S.month) return;
    if (!force && S.busy) return;
    S.version = res.version; S.rows = res.rows; S.cancels = res.cancels || []; S.shifts = res.shifts || []; S.usual = res.usual || {}; if (res.members) S.members = res.members;
    render();
    saveCache(res);
  }
  /* Last data seen, so the next start draws at once and fixes itself when the server answers. */
  var K_CACHE = "chwisik.cache";
  function saveCache(res) {
    if (res.month !== S.months[0]) return;
    lsSet(K_CACHE, JSON.stringify({ months: S.months, live: S.live, month: res }));
  }
  function loadCache() {
    try {
      var c = JSON.parse(lsGet(K_CACHE) || "null");
      if (!c || !c.month || !c.months || c.months[0] !== c.month.month || c.month.month !== curMonth()) return false;
      S.months = c.months; S.month = c.month.month; S.live = c.live; S.members = c.month.members || [];
      take(c.month, true);
      return true;
    } catch (e) { return false; }
  }
  function load(force) {
    if (S.busy) return Promise.resolve();
    var month = S.month;
    return run("getMonth", month, force ? "" : S.version).then(function (res) {
      setOnline(true);
      if (res && S.busy === 0 && month === S.month) take(res);
    }, function () { setOnline(false); });
  }
  /** Ask the server to pull today's 폐기 from BGF (it throttles to once per 2 min for everyone). */
  function refreshLive() {
    if (S.refreshing) return;
    S.refreshing = true; renderSync();
    run("refreshNow").then(function (info) {
      S.refreshing = false; S.live = info; setOnline(true);
      if (info && info.added) load(false);
    }, function () { S.refreshing = false; renderSync(); });
  }
  function setOnline(ok) { S.online = ok; renderSync(); }
  function renderSync() {
    var el = $("sync");
    if (!S.online) { el.className = "sync bad"; el.textContent = "연결 끊김 · 다시 시도 중"; return; }
    el.className = "sync ok";
    var l = S.live;
    el.textContent = S.refreshing ? "폐기 가져오는 중…"
      : l && l.label ? "업데이트 " + l.label + (l.error ? " · BGF 접속 안 됨" : "")
      : "실시간";
  }

  /* ---------- name picker ---------- */
  function choose(full) { S.me = full; lsSet(K_ME, S.me); $("picker").hidden = true; S.who = ""; render(); }
  function openPicker() {
    var box = $("names"); box.textContent = "";
    S.members.forEach(function (m) {
      var b = mk("button", m.full === S.me ? "cur" : "", m.full + (m.hasPw ? " 🔒" : "")); b.type = "button";
      b.addEventListener("click", function () {
        if (m.hasPw && !tok(m.full)) { openPw("login", m.full); return; }
        choose(m.full);
      });
      box.appendChild(b);
    });
    $("picker").hidden = false;
  }

  /* ---------- 비밀번호 ---------- */
  var PW = { mode: "", name: "" };
  /** mode 'login': enter the password of `name`. mode 'set': make / change / remove my password. */
  function openPw(mode, name) {
    var m = memberOf(name);
    if (!m) return;
    PW = { mode: mode, name: m.full };
    var login = mode === "login";
    $("pwTitle").textContent = login ? m.full + " 님 비밀번호" : m.hasPw ? "비밀번호 바꾸기" : "비밀번호 만들기";
    $("pwText").textContent = login ? "이 이름은 비밀번호가 있어요. 잊었으면 점장님께 말해 주세요."
      : m.hasPw ? "새 비밀번호를 적거나, 비밀번호 없이 쓰려면 [없애기]를 눌러요."
      : "다른 사람이 내 이름으로 등록하지 못하게 비밀번호를 만들 수 있어요. 없어도 괜찮아요. (4자 이상)";
    $("pwInput").value = ""; $("pwInput").autocomplete = login ? "current-password" : "new-password";
    $("pwInput").placeholder = login ? "비밀번호" : "새 비밀번호 (4자 이상)";
    $("pwRemove").hidden = login || !m.hasPw;
    $("pwOk").textContent = login ? "확인" : "저장";
    $("pwOk").disabled = false;
    $("pwSheet").hidden = false;
    setTimeout(function () { $("pwInput").focus(); }, 50);
  }
  function closePw() { $("pwSheet").hidden = true; }
  function savePw(newPw) {
    $("pwOk").disabled = true;
    run("setPassword", PW.name, tok(PW.name), newPw).then(function (res) {
      setTok(PW.name, res.token); S.members = res.members; closePw(); render();
      snack(newPw ? "비밀번호를 저장했어요." : "비밀번호를 없앴어요.");
    }, function (e) {
      $("pwOk").disabled = false;
      if (isAuthErr(e)) { openPw("login", PW.name); }
      snack(errMsg(e));
    });
  }
  $("pwForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var v = $("pwInput").value;
    if (PW.mode === "set") {
      if (v.length < 4) { snack("비밀번호는 4자 이상으로 해 주세요."); return; }
      savePw(v); return;
    }
    if (!v) { snack("비밀번호를 적어 주세요."); return; }
    $("pwOk").disabled = true;
    var name = PW.name;
    run("login", name, v).then(function (res) {
      setTok(name, res.token); closePw(); choose(name); snack(name + " 님, 확인됐어요.");
    }, function (err) { $("pwOk").disabled = false; snack(errMsg(err)); });
  });
  $("pwRemove").addEventListener("click", function () {
    confirmBox("비밀번호를 없앨까요?", "없애면 누구나 이 이름으로 등록할 수 있어요.", "없애기", true, function () { savePw(""); });
  });
  $("pwCancel").addEventListener("click", closePw);
  $("pwSheet").addEventListener("click", function (e) { if (e.target === this) closePw(); });
  $("mePw").addEventListener("click", function () { if (memberOf(S.me)) openPw("set", S.me); });
  $("meChange").addEventListener("click", openPicker);
  $("picker").addEventListener("click", function (e) { if (e.target === this && memberOf(S.me)) this.hidden = true; });
  $("addBtn").addEventListener("click", function () {
    var v = $("newName").value.trim();
    if (v.length < 2) { snack("전체 이름을 두 글자 이상 적어 주세요."); return; }
    this.disabled = true; var btn = this;
    run("addMember", v).then(function (mem) {
      btn.disabled = false; S.members = mem; $("newName").value = "";
      var clean = v.replace(/[=+\-@'"<>]/g, "").trim().slice(0, 10);
      var m = memberOf(clean);
      if (m && m.hasPw && !tok(clean)) { openPw("login", clean); return; }
      choose(clean);
    }, function (e) { btn.disabled = false; snack(errMsg(e, "추가하지 못했어요.")); });
  });

  /* ---------- misc controls ---------- */
  var snackTimer = null, snackUndoFn = null;
  function snack(text, undo) {
    $("snackText").textContent = text; snackUndoFn = undo || null;
    $("snackUndo").hidden = !undo; $("snack").hidden = false;
    clearTimeout(snackTimer);
    snackTimer = setTimeout(function () { $("snack").hidden = true; snackUndoFn = null; }, 5000);
  }
  $("snackUndo").addEventListener("click", function () { var fn = snackUndoFn; snackUndoFn = null; $("snack").hidden = true; if (fn) fn(); });
  var tabsEls = document.querySelectorAll(".tab");
  for (var i = 0; i < tabsEls.length; i++) tabsEls[i].addEventListener("click", function () { S.view = this.getAttribute("data-view"); render(); window.scrollTo(0, 0); });
  $("q").addEventListener("input", function () { S.q = this.value; render(); });
  function goMonth(delta) {
    var i = S.months.indexOf(S.month) + delta;
    if (i < 0 || i >= S.months.length) return;
    S.month = S.months[i]; S.rows = []; S.cancels = []; S.shifts = []; S.version = ""; render(); load(true);
  }
  $("mPrev").addEventListener("click", function () { goMonth(1); });
  $("mNext").addEventListener("click", function () { goMonth(-1); });
  $("sync").addEventListener("click", function () { refreshLive(); load(true); });

  /* ---------- pull to refresh ----------
     At the top of the page, drag down and let go: same as tapping the sync button (BGF check + reload).
     Works in the app and on the /exec link (the page scrolls inside its own frame). */
  (function () {
    var ptr = mk("div", "ptr"); ptr.appendChild(mk("i")); ptr.setAttribute("aria-hidden", "true");
    document.body.appendChild(ptr);
    var GO = 64, MAX = 96, y0 = null, x0 = 0, pull = 0, pulling = false, busy = false;
    function atTop() { return (window.scrollY || document.documentElement.scrollTop || document.body.scrollTop || 0) <= 0; }
    function blocked() { return busy || !!document.querySelector(".sheet:not([hidden])"); }
    function show(p) {
      ptr.style.transition = "none";
      ptr.style.opacity = String(Math.min(1, p / GO));
      ptr.style.transform = "translateY(" + (p - 44) + "px) rotate(" + Math.round(p * 4) + "deg)";
      ptr.classList.toggle("ready", p >= GO);
    }
    function hide() {
      ptr.style.transition = "transform .2s, opacity .2s";
      ptr.style.transform = "translateY(-44px)"; ptr.style.opacity = "0";
      ptr.classList.remove("go", "ready");
    }
    document.addEventListener("touchstart", function (e) {
      y0 = null; pulling = false; pull = 0;
      if (e.touches.length !== 1 || blocked() || !atTop()) return;
      y0 = e.touches[0].clientY; x0 = e.touches[0].clientX;
    }, { passive: true });
    document.addEventListener("touchmove", function (e) {
      if (y0 === null) return;
      var dy = e.touches[0].clientY - y0, dx = e.touches[0].clientX - x0;
      if (!pulling) {
        if (Math.abs(dy) < 8 && Math.abs(dx) < 8) return;
        if (dy <= 0 || Math.abs(dx) > dy || !atTop()) { y0 = null; return; } // 위로 밀기, 옆으로 밀기 = 보통 스크롤
        pulling = true; y0 += dy; dy = 0;
      }
      pull = Math.max(0, Math.min(MAX, dy * 0.55));
      if (e.cancelable) e.preventDefault();
      show(pull);
    }, { passive: false });
    function end() {
      if (y0 === null) return;
      y0 = null;
      if (!pulling) return;
      pulling = false;
      if (pull < GO) { hide(); return; }
      busy = true;
      ptr.classList.add("go");
      ptr.style.transition = "transform .2s"; ptr.style.transform = "translateY(" + (GO - 44) + "px)";
      var t0 = Date.now();
      refreshLive();
      load(true).then(null, function () {}).then(function () {
        setTimeout(function () { busy = false; hide(); }, Math.max(0, 450 - (Date.now() - t0)));
      });
    }
    document.addEventListener("touchend", end);
    document.addEventListener("touchcancel", function () { pull = 0; end(); });
  })();
  document.addEventListener("keydown", function (e) {
    if (e.key !== "Escape") return;
    if (!$("confirm").hidden) closeConfirm();
    else if (!$("pwSheet").hidden) closePw();
    else if (!$("shiftEd").hidden) closeEditor();
    else if (!$("picker").hidden && memberOf(S.me)) $("picker").hidden = true;
  });
  document.addEventListener("visibilitychange", function () { if (!document.hidden && S.month) { load(false); refreshLive(); } });

  /* ---------- app self-update ----------
     The app ships a copy of this page; on start it asks the server for the current one (by hash),
     keeps it in localStorage, and switches to it the next time the app comes back to the front. */
  var pageReady = false;
  function checkAppUpdate() {
    if (!API) return;
    run("getPage", window.CHWISIK_PAGE_HASH || "").then(function (p) {
      if (!p || !p.html) return;
      lsSet("chwisik.page", JSON.stringify(p));
      pageReady = true;
    }, function () {});
  }
  document.addEventListener("visibilitychange", function () { if (pageReady && !document.hidden && !S.busy) location.reload(); });

  /* ---------- boot ---------- */
  if (!loadCache()) render();
  run("getBoot", S.me, tok()).then(function (boot) {
    var init = boot.init;
    S.members = init.members; S.months = init.months; S.month = init.months[0]; S.live = init.live;
    S.version = "";
    if (boot.month) take(boot.month, true); else render();
    if (!memberOf(S.me)) openPicker();
    else if (init.meOk === false) { setTok(S.me, ""); openPw("login", S.me); }
    refreshLive();
    checkAppUpdate();
    setInterval(function () { if (!document.hidden) load(false); }, POLL_MS);
    setInterval(function () { if (!document.hidden) refreshLive(); }, LIVE_MS);
    setInterval(function () { if (!document.hidden && !S.busy && S.view === "shift") render(); }, 60000);
  }, function (e) {
    setOnline(false); $("sync").textContent = "연결 실패";
    status("목록을 불러오지 못했어요. 잠시 뒤 새로고침해 주세요. (" + errMsg(e, "") + ")");
  });
})();
</script>
</body>
</html>
