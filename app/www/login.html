<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>취식 로그인</title>
<link rel="icon" href="icon-192.png">
<style>
  :root { color-scheme: light dark; --ink: #19201c; --muted: #646f69; --paper: #f2f4f1; --sheet: #fff; --rule: #dfe4e0; --accent: #1f7a4d; --bad: #b3261e; }
  @media (prefers-color-scheme: dark) { :root { --ink: #e8ece9; --muted: #a3ada7; --paper: #19201c; --sheet: #222b26; --rule: #34403a; --accent: #5cc08b; --bad: #f2b8b5; } }
  html, body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  main { min-height: 100vh; display: grid; place-items: center; padding: 16px; box-sizing: border-box; }
  .card { width: min(380px, 100%); background: var(--sheet); border: 1px solid var(--rule); border-radius: 16px; padding: 20px; display: grid; gap: 12px; box-sizing: border-box; }
  h1 { margin: 0; font-size: 18px; }
  p { margin: 0; color: var(--muted); font-size: 14px; }
  #msg { min-height: 1.5em; }
  #msg.ok { color: var(--accent); font-weight: 700; }
  #msg.bad { color: var(--bad); }
  b { color: var(--ink); word-break: break-all; }
  .btn { display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 44px; border-radius: 22px; text-decoration: none; font-weight: 700; box-sizing: border-box; }
  .btn[hidden] { display: none; }
  .gbtn { background: #fff; color: #1f1f1f; border: 1px solid #747775; }
  .go { background: var(--accent); color: #fff; border-radius: 10px; }
  .btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
</style>
</head>
<body>
<main><div class="card">
  <h1>취식 로그인</h1>
  <p id="lead">가게에서 허용한 Google 계정만 들어갈 수 있어요. 한 번 허용된 계정은 계속 들어가져요.</p>
  <a class="btn gbtn" id="gbtn" hidden><svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.6 5.4 2.7 13.3l7.9 6.1C12.5 13.6 17.8 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.4c-.5 2.9-2.2 5.3-4.6 6.9l7.4 5.7c4.3-4 6.9-9.9 6.9-17.1z"/><path fill="#FBBC05" d="M10.6 28.6c-.5-1.4-.8-3-.8-4.6s.3-3.2.8-4.6l-7.9-6.1C1 16.6 0 20.2 0 24s1 7.4 2.7 10.7l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.4-5.7c-2.1 1.4-4.8 2.3-8.5 2.3-6.2 0-11.5-4.1-13.4-9.8l-7.9 6.1C6.6 42.6 14.6 48 24 48z"/></svg><span id="gtext">Google 계정으로 로그인</span></a>
  <p id="msg" role="status"></p>
  <a class="btn go" id="go" hidden></a>
</div></main>
<script>
/* Sign in with Google for the staff page (docs/DEVNOTES.md, Access). Opened by the page's gate as
   login.html?n=<nonce>[&app=1]. No popup: this page sends the whole tab to Google's account chooser (OpenID Connect,
   response_type id_token, nonce = n) and Google sends it back here with #id_token=…&state=…. The token goes to the
   server with the nonce (gLogin; the server checks the token's nonce too), and the phone that opened this (polling
   gPoll) gets in once the account is allowed. In a browser this tab then goes straight into the staff page ("./",
   key stored; while the account waits, the page's gate waits) - no button to tap (owner, 2026-11-26). Google sign-in
   doesn't work inside the Android app's WebView, so the app opens this in the phone's browser (app=1: the app is
   opened at once, with a button back to it in case Chrome wants a tap).
   GOOGLE_CLIENT_ID must match Code.gs; this page's address is the client's authorized redirect URI.
   (The first version used Google's GIS button in popup mode: in the owner's Chrome the popup opened and nothing
   came back.) */
(function () {
  var GOOGLE_CLIENT_ID = "274035594907-i92r76rlpp0c9h1dt79bm6fcheb77b44.apps.googleusercontent.com";
  var API = "https://script.google.com/macros/s/AKfycbzmsekRKq8HY5jqog-Dpb80yJqv-n3H4fZMItLZPISuM39M6RVyr3qOtqtz864YwlRKpw/exec";
  var HERE = location.origin + location.pathname;   // https://kiiwoom8.github.io/chwisik/login.html
  var $ = function (id) { return document.getElementById(id); };
  var NONCE = /^[A-Za-z0-9_-]{22,64}$/;
  function say(t, cls) { $("msg").className = cls || ""; $("msg").textContent = t; }
  function sayWho(email, rest, cls) {
    $("msg").className = cls || ""; $("msg").textContent = "";
    var b = document.createElement("b"); b.textContent = email;
    $("msg").appendChild(b); $("msg").appendChild(document.createTextNode(" " + rest));
  }
  function back(label, fromApp) {
    var a = $("go");
    // Android app: Chrome opens the installed app (launcher intent); elsewhere: the staff page in this browser
    a.href = fromApp ? "intent:#Intent;action=android.intent.action.MAIN;category=android.intent.category.LAUNCHER;package=com.kiiwoom8.chwisik;end" : "./";
    a.textContent = label;
    a.hidden = false;
  }
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }
  /** This browser opened the sign-in (its gate holds the same nonce), so its gate can take over. */
  function sameNonce(n) { try { return JSON.parse(lsGet("chwisik.gn") || "null").n === n; } catch (e) { return false; } }
  /** Straight into the staff page in this tab (it boots with the stored key, or its gate keeps waiting). */
  function enter() { say("취식으로 들어가는 중…"); location.replace("./"); }
  /** Android app: try opening the app at once; the button stays in case Chrome wants a tap for it. */
  function openApp() { setTimeout(function () { try { location.href = $("go").href; } catch (e) {} }, 300); }
  function call(fn, args) {
    return fetch(API, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ fn: fn, args: args }) })
      .then(function (r) { if (!r.ok) throw new Error("서버 응답 " + r.status); return r.json(); })
      .then(function (j) { if (!j || !j.ok) throw new Error((j && j.err) || "서버 오류"); return j.r; });
  }
  function googleUrl(n, fromApp) {
    return "https://accounts.google.com/o/oauth2/v2/auth?" + [
      "client_id=" + encodeURIComponent(GOOGLE_CLIENT_ID),
      "redirect_uri=" + encodeURIComponent(HERE),
      "response_type=id_token",
      "scope=" + encodeURIComponent("openid email"),
      "nonce=" + n,
      "state=" + n + (fromApp ? ".app" : ""),
      "prompt=select_account"
    ].join("&");
  }
  function offer(n, fromApp, label) {   // the button: Google's account chooser again
    $("gbtn").href = googleUrl(n, fromApp);
    $("gtext").textContent = label || "Google 계정으로 로그인";
    $("gbtn").hidden = false;
  }

  // 1. Back from Google: #id_token=…&state=… (or #error=…)
  var h = new URLSearchParams((location.hash || "").replace(/^#/, ""));
  if (h.get("id_token") || h.get("error")) {
    try { history.replaceState(null, "", HERE); } catch (e) {}
    var st = String(h.get("state") || ""), fromApp = /\.app$/.test(st), n = st.replace(/\.app$/, "");
    if (!NONCE.test(n)) { enter(); return; }
    if (h.get("error")) {
      say(h.get("error") === "access_denied" ? "로그인을 취소했어요. 다시 하려면 아래 버튼을 눌러 주세요." : "Google 로그인 오류: " + h.get("error"), "bad");
      offer(n, fromApp);
      return;
    }
    say("확인 중…");
    call("gLogin", [n, h.get("id_token")]).then(function (r) {
      if (r.s === "ok") {
        if (fromApp) {
          sayWho(r.email, "계정으로 확인했어요. 취식 앱을 여는 중…", "ok");
          back("취식 앱으로 돌아가기", true);
          openApp();
          return;
        }
        // same address as the staff page: store this browser's key and go straight in (no extra button)
        sayWho(r.email, "계정으로 확인했어요. 들어가는 중…", "ok");
        call("gPoll", [n, lsGet("chwisik.devOld") || ""]).then(function (p) {
          if (p && p.dev) {
            lsSet("chwisik.dev", p.dev);
            if (sameNonce(n)) lsDel("chwisik.gn");
            lsDel("chwisik.devOld");
          }
          enter();
        }, enter);   // the gate asks gPoll again itself
      } else if (r.s === "no") {
        sayWho(r.email, "계정은 허용되지 않았어요. 다른 계정이면 아래 버튼으로 다시 로그인해 주세요.", "bad");
        offer(n, fromApp, "다른 계정으로 로그인");
      } else {
        sayWho(r.email, "계정의 허용을 사장님께 요청했어요. 허용되면 취식 앱이 바로 열려요. 이 창은 닫아도 돼요.");
        // the gate in this browser waits for the owner and opens by itself once allowed
        if (!fromApp && sameNonce(n)) { enter(); return; }
        if (fromApp) { back("취식 앱으로 돌아가기", true); openApp(); }
        offer(n, fromApp, "다른 계정으로 로그인");
      }
    }, function (e) {
      say(String((e && e.message) || "연결을 확인해 주세요.").replace(/^(Error:\s*)?\[접근\]\s*/, ""), "bad");
      offer(n, fromApp, "다시 로그인");
    });
    return;
  }

  // 2. Opened by the gate: straight on to Google's account chooser
  var q = new URLSearchParams(location.search), n0 = q.get("n") || "", app0 = q.get("app") === "1";
  if (!NONCE.test(n0)) { enter(); return; }   // opened by hand: the staff page has the sign-in button
  say("Google 로그인으로 넘어가는 중…");
  offer(n0, app0);
  location.replace(googleUrl(n0, app0));
})();
</script>
</body>
</html>
